                  value="${[50, 100, 250].includes(a.dosisRiegoMl) ? '' : a.dosisRiegoMl}"
                  ${isEStop ? 'disabled' : ''}
                  class="w-full px-2 py-1 text-xs rounded-lg border bg-inherit text-inherit focus:outline-none focus:ring-1 focus:ring-[#2ECC71]">
                <span class="absolute right-2 top-1 text-[10px] text-[#718096] pointer-events-none">ml</span>
              </div>
              <button onclick="applyCustomDose()" ${isEStop ? 'disabled' : ''}
                class="px-2.5 py-1 text-[11px] font-bold rounded-lg bg-[#2ECC71] hover:bg-[#27AE60] text-white cursor-pointer transition-all">
                Fijar
              </button>
            </div>
          </div>
        </div>

        <!-- E-STOP -->
        <div class="mt-4 pt-3 border-t border-inherit flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="alert-octagon" class="w-4 h-4 text-[#E53E3E]"></i>
            <span class="text-xs font-semibold ${isEStop ? 'text-[#E53E3E]' : ''}">
              ${isEStop ? 'E-STOP ACTIVO: Energía Cortada' : 'Parada de Emergencia (E-STOP)'}
            </span>
          </div>
          <button onclick="sendActuatorCommand({ paradaEmergencia: ${!isEStop} })"
            class="px-4 py-1.5 rounded-xl text-xs font-bold text-white transition-all cursor-pointer ${
              isEStop ? 'bg-[#2ECC71] hover:bg-[#27AE60]' : 'bg-[#E53E3E] hover:bg-[#C53030]'
            }">
            ${isEStop ? 'Restablecer (Reset)' : 'ACCIONAR E-STOP'}
          </button>
        </div>
      `;
      lucide.createIcons();
    }

    // ==========================================
    // CONTROL DE MODO DE VISTA DE FLOTA (COMPLETA / COMPACTA) CON ANIMACIÓN
    // ==========================================
    function setFleetViewMode(mode) {
      if (state.fleetViewMode === mode) return;

      const container = document.getElementById('fleet-grid-container');
      if (!container) {
        state.fleetViewMode = mode === 'compact' ? 'compact' : 'full';
        localStorage.setItem('smartgarden_fleet_view_mode', state.fleetViewMode);
        updateFleetViewToggleDOM();
        renderFleetGridDOM(false);
        return;
      }

      // Animación suave de salida (desvanecimiento y micro-escala)
      container.classList.add('opacity-0', 'scale-[0.98]', 'pointer-events-none');

      setTimeout(() => {
        state.fleetViewMode = mode === 'compact' ? 'compact' : 'full';
        localStorage.setItem('smartgarden_fleet_view_mode', state.fleetViewMode);
        updateFleetViewToggleDOM();
        // Solo activamos la animación de entrada al cambiar de modo
        renderFleetGridDOM(true);

        // Animación suave de entrada en cascada
        requestAnimationFrame(() => {
          container.classList.remove('opacity-0', 'scale-[0.98]', 'pointer-events-none');
        });
      }, 150);
    }

    function updateFleetViewToggleDOM() {
      const fullBtn = document.getElementById('fleet-view-full-btn');
      const compactBtn = document.getElementById('fleet-view-compact-btn');
      if (!fullBtn || !compactBtn) return;

      const isFull = state.fleetViewMode === 'full';
      const activeClass = 'bg-[#2ECC71] text-white shadow-xs';
      const inactiveClass = 'text-[#718096] hover:text-inherit';

      fullBtn.className = `px-2.5 py-1 text-xs font-semibold rounded-lg transition-all duration-200 flex items-center gap-1.5 cursor-pointer ${isFull ? activeClass : inactiveClass}`;
      compactBtn.className = `px-2.5 py-1 text-xs font-semibold rounded-lg transition-all duration-200 flex items-center gap-1.5 cursor-pointer ${!isFull ? activeClass : inactiveClass}`;
      lucide.createIcons();
    }

    // ==========================================
    // RENDERIZADO DE FLOTA (MODO COMPLETO Y COMPACTO CON ENTRADA ESCALONADA)
    // ==========================================
    function renderFleetGridDOM(animate = false) {
      const container = document.getElementById('fleet-grid-container');
      if (!container) return;

      const isOled = state.theme === 'oled';
      const itemBg = isOled ? 'bg-[#181818] border-[#2A2A2A]' : 'bg-white border-[#E2E8F0]';

      // Sincronizar estilo de rejilla según el modo con transición fluida
      if (state.fleetViewMode === 'compact') {
        container.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 transition-all duration-300 ease-out';
      } else {
        container.className = 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 transition-all duration-300 ease-out';
      }

      updateFleetViewToggleDOM();

      // Actualizar contador del header resumen en vivo
      const plantsCountEl = document.getElementById('header-plants-count');
      if (plantsCountEl) {
        plantsCountEl.innerText = `${state.userPlants.length} registradas`;
      }

      if (state.userPlants.length === 0) {
        container.innerHTML = `
          <div class="col-span-full p-8 text-center rounded-2xl border border-dashed border-[#E2E8F0] dark:border-[#2A2A2A] text-xs text-[#718096]">
            No tienes macetas registradas aún. Busca una planta en el catálogo inferior para añadirla a tu flota y visualizarla en 3D.
          </div>
        `;
        return;
      }

      container.innerHTML = state.userPlants.map((p, idx) => {
        const isSelected = p.id === state.selectedFleetPlantId;
        const health = calculatePlantHealth(p, getPlantTelemetry(p));
        const selectedBorder = isSelected
          ? isOled
            ? 'border-2 border-[#2ECC71] shadow-md shadow-[#2ECC71]/20 ring-1 ring-[#2ECC71]/30'
            : 'border-2 border-[#15803D] shadow-md shadow-[#15803D]/25 ring-1 ring-[#15803D]/30'
          : `border border-inherit ${isOled ? 'hover:border-[#2ECC71]/50' : 'hover:border-[#15803D]/50'}`;

        const animClass = animate ? 'fleet-card-anim' : '';
        const animDelayStyle = animate ? `style="animation-delay: ${Math.min(idx * 35, 280)}ms;"` : '';

        // ----------------------------------------------------
        // MODO 1: VISTA COMPACTA / MINIMALISTA (Avatar + Ficha compacta)
        // ----------------------------------------------------
        if (state.fleetViewMode === 'compact') {
          return `
          <div onclick="selectFleetPlant(${p.id})"
            ${animDelayStyle}
            class="${animClass} ${itemBg} ${selectedBorder} rounded-2xl p-3 shadow-xs transition-all duration-200 flex flex-col justify-between group relative cursor-pointer hover:shadow-md">
            
            <div class="flex items-start gap-3 min-w-0">
              <!-- Avatar Pequeño de la Planta con indicador de esquina en 3D -->
              <div class="relative w-12 h-12 shrink-0">
                <img src="${p.imagen_url}" alt="${p.nombre}" class="w-full h-full rounded-xl object-cover object-center ring-1 ring-black/10 group-hover:scale-105 transition-transform duration-300">
                ${isSelected ? `
                  <span class="absolute -top-1 -right-1 flex h-3.5 w-3.5 items-center justify-center z-10" title="Activa en Gemelo 3D">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full ${isOled ? 'bg-[#2ECC71]' : 'bg-[#15803D]'} opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 ${isOled ? 'bg-[#2ECC71]' : 'bg-[#15803D]'} border-2 border-white dark:border-[#181818] shadow-sm"></span>
                  </span>
                ` : ''}
              </div>

              <!-- Información de la Planta -->
              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-1">
                  <h4 class="text-xs font-bold tracking-tight truncate">${p.nombre}</h4>
                  <!-- Botón Eliminar Maceta -->
                  <button type="button"
                    onclick="deleteFleetPlant(event, ${p.id}, '${p.nombre.replace(/'/g, "\\'")}')"
                    title="Eliminar maceta de la flota"
                    class="p-1 rounded-lg text-gray-400 hover:text-red-500 hover:bg-red-500/10 transition-all shrink-0 cursor-pointer">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
                <p class="text-[11px] text-[#718096] italic truncate">${p.especie}</p>
                
                <div class="flex items-center gap-1.5 mt-1.5 flex-wrap">
                  <span class="px-2 py-0.5 rounded-full text-[9px] font-bold shrink-0 ${health.badgeClass}">
                    ${health.status === 'optimo' ? '🟢 Óptimo' : health.status === 'atencion' ? '🟠 Atención' : '🔴 Crítico'}
                  </span>
                  ${isSelected ? `
                    <span class="px-1.5 py-0.5 rounded-md text-[9px] font-extrabold bg-[#2ECC71] text-white">
                      En 3D
                    </span>
                  ` : ''}
                </div>
              </div>
            </div>

            <!-- Barra Inferior de Riego Calibrado y Umbral -->
            <div class="mt-2.5 pt-2 border-t ${isSelected ? (isOled ? 'border-[#2ECC71]/35' : 'border-[#15803D]/40') : 'border-inherit'} flex items-center justify-between gap-2">
              <span class="text-[10px] text-[#718096] font-medium truncate">💧 Mín ${p.humedad_min}%</span>
              <button type="button"
                onclick="event.stopPropagation(); triggerQuickWater('${p.nombre.replace(/'/g, "\\'")}', ${p.dosis_riego_ml})"
                title="Regar ${p.nombre} con ${p.dosis_riego_ml} ml"
                class="px-2.5 py-1 bg-[#D9F0DC] hover:bg-[#BCE3C1] text-[#246B2B] text-[11px] font-bold rounded-lg transition-all flex items-center gap-1 cursor-pointer shrink-0">
                <i data-lucide="droplet" class="w-3 h-3"></i>
                <span>Regar (${p.dosis_riego_ml}ml)</span>
              </button>
            </div>
          </div>
          `;
        }

        // ----------------------------------------------------
        // MODO 2: VISTA COMPLETA (Imagen grande con zoom suave hacia afuera al cursor)
        // ----------------------------------------------------
        return `
        <div onclick="selectFleetPlant(${p.id})"
          ${animDelayStyle}
          class="${animClass} ${itemBg} ${selectedBorder} rounded-2xl p-4 shadow-xs transition-all duration-200 flex flex-col justify-between group relative cursor-pointer">
          
          <div>
            <!-- Contenedor de Imagen con expansión suave hacia afuera al pasar el cursor -->
            <div class="relative w-full mb-3">
              <div class="relative w-full h-44 rounded-xl overflow-hidden bg-gray-100">
                <img src="${p.imagen_url}" alt="${p.nombre}" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300 ease-out">
                
                <!-- Botón Eliminar Maceta (Trash Icon) -->
                <button type="button"
                  onclick="deleteFleetPlant(event, ${p.id}, '${p.nombre.replace(/'/g, "\\'")}')"
                  title="Eliminar maceta de la flota"
                  class="absolute top-2 right-2 z-10 p-1.5 rounded-lg bg-black/65 hover:bg-red-600 text-white transition-all shadow-sm flex items-center justify-center cursor-pointer">
                  <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                </button>
              </div>

              <!-- Punto Indicador Verde en Esquina (Maceta Activa en Gemelo 3D) -->
              ${isSelected ? `
                <span class="absolute -top-1.5 -right-1.5 flex h-4 w-4 items-center justify-center z-20 pointer-events-none" title="Activa en Gemelo 3D">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full ${isOled ? 'bg-[#2ECC71]' : 'bg-[#15803D]'} opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3.5 w-3.5 ${isOled ? 'bg-[#2ECC71]' : 'bg-[#15803D]'} border-2 border-white dark:border-[#181818] shadow-md"></span>
                </span>
              ` : ''}
            </div>

            <!-- Cabecera de la Maceta con Semáforo de Salud individual -->
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <h4 class="text-xs font-bold tracking-tight line-clamp-1">${p.nombre}</h4>
                <p class="text-[11px] text-[#718096] italic line-clamp-1">${p.especie}</p>
              </div>
              <span class="px-2 py-0.5 rounded-full text-[9px] font-bold shrink-0 ${health.badgeClass}">
                ${health.status === 'optimo' ? '🟢 Óptimo' : health.status === 'atencion' ? '🟠 Atención' : '🔴 Crítico'}
              </span>
            </div>
            
            <div class="mt-3 pt-2 border-t ${isSelected ? (isOled ? 'border-[#2ECC71]/35' : 'border-[#15803D]/40') : 'border-inherit'} space-y-1.5 text-[11px]">
              <div class="flex justify-between">
                <span class="text-[#718096]">Humedad Mínima:</span>
                <span class="font-bold text-[#2B6CB0]">${p.humedad_min}%</span>
              </div>
              <div class="flex justify-between">
                <span class="text-[#718096]">Límite Térmico:</span>
                <span class="font-bold text-[#DD6B20]">${p.temp_max}°C</span>
              </div>
            </div>
          </div>

          <div class="mt-4 flex gap-2">
            <button type="button"
              onclick="event.stopPropagation(); triggerQuickWater('${p.nombre.replace(/'/g, "\\'")}', ${p.dosis_riego_ml})"
              class="w-full py-2 bg-[#D9F0DC] hover:bg-[#BCE3C1] text-[#246B2B] text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 cursor-pointer">
              <i data-lucide="droplet" class="w-3.5 h-3.5"></i>
              <span>Riego Calibrado (${p.dosis_riego_ml}ml)</span>
            </button>
          </div>
        </div>
      `;
      }).join('');

      lucide.createIcons();
    }

    // ==========================================
    // RENDERIZADO DE BÚSQUEDA CON VISTA PREVIA HOVER
    // ==========================================
    function renderSearchResultsDOM() {
      const container = document.getElementById('search-results-container');
      if (!container) return;

      const isOled = state.theme === 'oled';
      const itemBg = isOled ? 'bg-[#181818] border-[#2A2A2A]' : 'bg-white border-[#E2E8F0]';

      if (state.isSearching) {
        container.innerHTML = [1, 2, 3, 4].map(() => `
          <div class="${itemBg} border rounded-2xl p-4 animate-pulse space-y-3">
            <div class="w-full h-44 rounded-xl bg-gray-200 dark:bg-gray-800"></div>
            <div class="w-3/4 h-3.5 rounded bg-gray-200 dark:bg-gray-800"></div>
            <div class="w-1/2 h-2.5 rounded bg-gray-200 dark:bg-gray-800"></div>
            <div class="w-full h-8 rounded-xl bg-gray-200 dark:bg-gray-800 mt-2"></div>
          </div>
        `).join('');
        return;
      }

      if (state.searchResults.length === 0) {
        if (!state.searchQuery.trim()) {
          container.innerHTML = '';
          return;
        }
        if (state.searchError) {
          container.innerHTML = `
            <div class="col-span-full p-8 text-center text-xs text-[#C53030]">
              ${state.searchError}
            </div>
          `;
          return;
        }
        container.innerHTML = `
          <div class="col-span-full p-8 text-center text-xs text-[#718096]">
            No se encontraron especies botánicas para "${state.searchQuery}". Intenta con otro término.
          </div>
        `;
        return;
      }

      container.innerHTML = state.searchResults.map(p => `
        <div class="${itemBg} border rounded-2xl p-4 shadow-xs hover:shadow-md transition-all flex flex-col justify-between group relative">
          <div>
            <!-- Contenedor de Imagen con expansión suave hacia afuera al pasar el cursor -->
            <div class="relative w-full h-44 rounded-xl overflow-hidden mb-3 bg-gray-100">
              <img src="${p.imagen_url}" alt="${p.nombre_comun}" class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300 ease-out">
            </div>

            <h4 class="text-xs font-bold line-clamp-1">${p.nombre_comun}</h4>
            <p class="text-[11px] text-[#718096] italic line-clamp-1">${p.especie}</p>
            <p class="text-[10px] text-[#A0AEC0] mt-0.5">${p.familia}</p>

            <!-- Ficha de Condiciones Óptimas Recomendadas -->
            <div class="mt-2.5 pt-2 border-t border-inherit grid grid-cols-2 gap-1.5 text-[10px]">
              <div class="flex items-center gap-1 text-[#2B6CB0] font-semibold" title="Humedad mínima del suelo recomendada">
                <span>💧 Mín:</span>
                <span class="font-bold">${p.humedad_min || 30}% H</span>
              </div>
              <div class="flex items-center gap-1 text-[#E65100] font-semibold" title="Rango de temperatura óptimo">
                <span>🌡️ Temp:</span>
                <span class="font-bold">${p.temp_min || 12}°C - ${p.temp_max || 32}°C</span>
              </div>
              <div class="col-span-2 flex items-center gap-1 text-[#D69E2E] font-semibold truncate" title="Requerimiento lumínico">
                <span>☀️ Luz:</span>
                <span class="font-bold truncate">${p.luz_optima || 'Luz indirecta'}</span>
              </div>
              <div class="col-span-2 flex items-center gap-1 text-[#2ECC71] font-semibold" title="Dosis recomendada de riego">
                <span>💦 Riego calibrado:</span>
                <span class="font-bold">${p.dosis_riego_ml || 100} ml</span>
              </div>
            </div>

            <p class="text-[11px] text-[#718096] mt-2 line-clamp-2">${p.descripcion}</p>
          </div>

          <button onclick="openPlantModal('${String(p.id).replace(/'/g, "\\'")}')"
            class="mt-4 w-full py-2 bg-[#2ECC71] hover:bg-[#27AE60] text-white text-xs font-bold rounded-xl transition-all flex items-center justify-center gap-1.5 cursor-pointer shadow-xs">
            <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
            <span>Ajustar Parámetros</span>
          </button>
        </div>
      `).join('');

      lucide.createIcons();
    }

    let searchDebounceTimeout = null;
    function handleSearchInput(e) {
      const q = e.target.value;
      if (searchDebounceTimeout) clearTimeout(searchDebounceTimeout);
      searchDebounceTimeout = setTimeout(() => {
        searchPlants(q);
      }, 300);
    }

    function scrollToSearch() {
      const el = document.getElementById('botanical-search-section');
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setTimeout(() => document.querySelector('#plant-search-input')?.focus(), 450);
      }
    }

    function triggerQuickWater(nombre, dosis) {
      sendActuatorCommand({ bombaAgua: true, dosisRiegoMl: dosis });
      showQuickWaterToast(nombre, dosis);
    }

    function showQuickWaterToast(nombre, dosis) {
      const existing = document.getElementById('quick-water-toast');
      if (existing) existing.remove();

      const isOled = state.theme === 'oled';
      const toast = document.createElement('div');
      toast.id = 'quick-water-toast';
      toast.className = `fixed right-4 top-4 z-[70] w-[min(360px,calc(100vw-2rem))] translate-x-8 opacity-0 rounded-2xl border p-4 shadow-2xl transition-all duration-500 ${
        isOled
          ? 'bg-[#121212] border-[#2ECC71]/50 text-[#E0E0E0] shadow-[#2ECC71]/10'
          : 'bg-[#FAF9F5] border-[#A5D6A7] text-[#2D3748] shadow-[#2ECC71]/20'
      }`;

      const content = document.createElement('div');
      content.className = 'flex items-start gap-3';

      const icon = document.createElement('div');
      icon.className = 'flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-[#2ECC71]/15 text-[#2ECC71]';
      icon.innerHTML = '<i data-lucide="droplets" class="h-5 w-5"></i>';

      const copy = document.createElement('div');
      copy.className = 'min-w-0 flex-1';
      copy.innerHTML = `
        <p class="text-[10px] font-bold uppercase tracking-wider text-[#2ECC71]">Riego calibrado</p>
        <p class="mt-1 text-sm font-bold">Comando enviado</p>
        <p class="mt-0.5 truncate text-xs ${isOled ? 'text-[#A0A0A0]' : 'text-[#718096]'}"></p>
      `;
      copy.querySelector('p:last-child').textContent = `${nombre} • ${dosis} ml`;

      const close = document.createElement('button');
      close.type = 'button';
      close.setAttribute('aria-label', 'Cerrar notificación');
      close.className = 'rounded-lg p-1 text-[#A0AEC0] transition-colors hover:bg-[#2ECC71]/10 hover:text-[#2ECC71]';
      close.innerHTML = '<i data-lucide="x" class="h-4 w-4"></i>';
      close.onclick = () => dismissQuickWaterToast(toast);

      content.append(icon, copy, close);
      toast.appendChild(content);
      document.body.appendChild(toast);
      lucide.createIcons();
      requestAnimationFrame(() => {
        toast.classList.remove('translate-x-8', 'opacity-0');
        toast.classList.add('translate-x-0', 'opacity-100');
      });
      toast._dismissTimer = setTimeout(() => dismissQuickWaterToast(toast), 4500);
    }

    function dismissQuickWaterToast(toast) {
      if (!toast || !toast.isConnected) return;
      clearTimeout(toast._dismissTimer);
      toast.classList.add('translate-x-8', 'opacity-0');
      setTimeout(() => toast.remove(), 300);
    }

    // ==========================================
    // MODAL DE AJUSTE FINO DE PARÁMETROS
    // ==========================================
    function openPlantModal(plantId) {
      const plant = state.searchResults.find(p => p.id === plantId);
      if (!plant) return;
      state.selectedPlantForConfig = plant;

      const container = document.getElementById('plant-modal-container');
      const isOled = state.theme === 'oled';
      const cardBg = isOled ? 'bg-[#181818] border-[#333333]' : 'bg-white border-[#E2E8F0]';

      container.innerHTML = `
        <div class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-4">
          <div class="${cardBg} border rounded-3xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            
            <button onclick="closePlantModal()" class="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-600 cursor-pointer">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <!-- Cabecera del Modal con Imagen Completa en Proporción Natural -->
            <div class="flex items-center gap-4 mb-4 pb-4 border-b border-inherit">
              <div class="w-20 h-20 rounded-2xl overflow-hidden bg-gray-100 shrink-0 border border-gray-200">
                <img src="${plant.imagen_url}" alt="${plant.nombre_comun}" class="w-full h-full object-contain p-1">
              </div>
              <div>
                <h3 class="text-base font-bold">${plant.nombre_comun}</h3>
                <p class="text-xs text-[#718096] italic">${plant.especie} • ${plant.familia}</p>
                <span class="text-[10px] font-bold text-[#2ECC71]">Luz: ${plant.luz_optima}</span>
              </div>
            </div>

            <form onsubmit="savePlantConfig(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-[#718096] mb-1">Nombre Personalizado de la Maceta</label>
                <input id="cfg-nombre" type="text" value="${plant.nombre_comun} - Maceta" required
                  class="w-full px-3.5 py-2.5 rounded-xl text-xs border ${isOled ? 'bg-[#222] border-[#333] text-white' : 'bg-gray-50 border-gray-200'}">
              </div>

              <!-- Dosis Milimétrica de Riego -->
              <div>
                <div class="flex justify-between text-xs font-semibold mb-1">
                  <span class="text-[#718096]">Dosis de Riego Calibrada</span>
                  <span id="cfg-dosis-val" class="text-[#2ECC71] font-bold">${plant.dosis_riego_ml} ml</span>
                </div>
                <input id="cfg-dosis" type="range" min="20" max="500" step="10" value="${plant.dosis_riego_ml}"
                  oninput="document.getElementById('cfg-dosis-val').innerText = this.value + ' ml'"
                  class="w-full accent-[#2ECC71]">
              </div>

              <!-- Umbral Mínimo Humedad -->
              <div>
                <div class="flex justify-between text-xs font-semibold mb-1">
                  <span class="text-[#718096]">Humedad Mínima Óptima</span>
                  <span id="cfg-hum-val" class="text-[#2B6CB0] font-bold">${plant.humedad_min}%</span>
                </div>
                <input id="cfg-hum-min" type="range" min="10" max="80" step="1" value="${plant.humedad_min}"
                  oninput="document.getElementById('cfg-hum-val').innerText = this.value + '%'"
                  class="w-full accent-[#2B6CB0]">
              </div>

              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-[#718096] mb-1">Temp Máxima Tolerada (°C)</label>
                  <input id="cfg-temp-max" type="number" step="0.5" value="${plant.temp_max}" required
                    class="w-full px-3.5 py-2 rounded-xl text-xs border ${isOled ? 'bg-[#222] border-[#333] text-white' : 'bg-gray-50 border-gray-200'}">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-[#718096] mb-1">Temp Mínima (°C)</label>
                  <input id="cfg-temp-min" type="number" step="0.5" value="${plant.temp_min}" required
                    class="w-full px-3.5 py-2 rounded-xl text-xs border ${isOled ? 'bg-[#222] border-[#333] text-white' : 'bg-gray-50 border-gray-200'}">
                </div>
              </div>

              <button type="submit"
                class="w-full py-3 bg-[#2ECC71] hover:bg-[#27AE60] text-white text-xs font-bold rounded-xl transition-all cursor-pointer shadow-md mt-4">
                Vincular a Maceta y Guardar en Flota
              </button>
            </form>

          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function closePlantModal() {
      const container = document.getElementById('plant-modal-container');
      if (container) container.innerHTML = '';
      state.selectedPlantForConfig = null;
    }

    // Inicialización al cargar la página
    window.addEventListener('DOMContentLoaded', () => {
      // Detección de parámetros de activación de cuenta por correo en la URL
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('activated') === 'true') {
        const user = urlParams.get('user') || '';
        state.activationNotice = {
          type: 'success',
          user: user
        };
        state.authMode = 'login';
        window.history.replaceState({}, document.title, window.location.pathname);
      } else if (urlParams.get('activation_error')) {
        state.activationNotice = {
          type: 'error'
        };
        state.authMode = 'login';
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      render();
      if (state.token) {
        initDashboardData();
      }
    });
  </script>

</body>
</html>
